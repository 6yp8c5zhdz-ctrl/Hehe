<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Coin Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(to bottom, #87CEEB, #98D8C8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        #gameContainer {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 20px;
            max-width: 900px;
            width: 100%;
        }

        #gameCanvas {
            border: 3px solid #333;
            border-radius: 10px;
            display: block;
            background: #f0f0f0;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }

        #ui {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .stat {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .stat span {
            color: #FFD700;
        }

        #instructions {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            text-align: center;
        }

        #instructions h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        #instructions p {
            color: #856404;
            font-size: 14px;
            margin: 5px 0;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #modalContent {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        #modalContent h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        #modalContent p {
            color: #666;
            margin: 15px 0;
            font-size: 16px;
            line-height: 1.6;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .emoji {
            font-size: 24px;
            margin: 0 5px;
        }

        #mobileControls {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        #talkButton {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 50%;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #talkButton:active {
            transform: scale(0.95);
        }

        @media (max-width: 768px) {
            #gameContainer {
                padding: 10px;
            }

            .stat {
                font-size: 14px;
                padding: 8px 15px;
            }

            #instructions {
                font-size: 12px;
                padding: 10px;
            }

            #instructions h3 {
                font-size: 14px;
            }

            #instructions p {
                font-size: 12px;
            }

            #mobileControls {
                display: block;
            }

            #modalContent {
                padding: 20px;
                margin: 10px;
            }

            #modalContent h2 {
                font-size: 22px;
            }

            #modalContent p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div class="stat">🪙 Coins: <span id="coinCount">0</span></div>
            <div class="stat">🍖 Food: <span id="foodCount">0</span></div>
            <div class="stat">📍 Level: <span id="levelCount">Training</span></div>
        </div>
        <div id="instructions">
            <h3>🎮 How to Play</h3>
            <p><strong>Desktop:</strong> Arrow Keys or WASD to move | SPACE to talk</p>
            <p><strong>Mobile:</strong> Touch and drag to move | Tap button to talk</p>
            <p>Collect 🪙 coins and 🐟 fish for your family!</p>
        </div>
    </div>

    <div id="mobileControls">
        <button id="talkButton">💬</button>
    </div>

    <div id="modal">
        <div id="modalContent">
            <h2 id="modalTitle">Welcome!</h2>
            <p id="modalText">Loading...</p>
            <div id="modalButtons"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Disable image smoothing for crisp pixel art
        ctx.imageSmoothingEnabled = false;

        // Game state
        const game = {
            state: 'training', // training, playing, dialogue, party
            level: 0,
            coins: 0,
            food: 0,
            currentDialogue: null,
            partyTime: 0

        // Player
        const player = {

            width: 40,

            dx: 0,
            dy: 0,
            color: '#FF8C00'

        // Keys
        const keys = {

            ArrowDown: false,
            ArrowLeft: false,
            ArrowRight: false,
            w: false,
            a: false,
            s: false,
            d: false,

        // Level configurations
        const levels = [

                ],
                bench: null,

            },

                coins: [

            },
            {

                coins: [

                    { x: 450, y: 200, collected: false },

                ],
                food: [
                    { x: 200, y: 450, collected: false },

                    { x: 400, y: 250, collected: false },

                ],
                cats: [
                    { x: 250, y: 320, name: 'Shadow', friendly: Math.random() > 0.3 },
                    { x: 400, y: 180, name: 'Luna', friendly: true },

                ],

                ],

                ],
                cats: [

                    { x: 450, y: 280, name: 'Felix', friendly: Math.random() > 0.4 },

            {

                    { x: 460, y: 400, collected: false },

                    { x: 620, y: 380, collected: false }
                ],
                cats: [
                    { x: 300, y: 300, name: 'Sir Purr', friendly: true },
                    { x: 520, y: 280, name: 'Princess', friendly: true }
                ],
                bench: { x: 420, y: 500, used: false },
                homeX: 700
            },
            {
                name: 'Mountain Pass',
                scene: 'mountain',
                coins: [
                    { x: 160, y: 520, collected: false },
                    { x: 220, y: 460, collected: false },
                    { x: 300, y: 380, collected: false },
                    { x: 380, y: 300, collected: false },
                    { x: 460, y: 240, collected: false },
                    { x: 540, y: 300, collected: false },

                    { x: 680, y: 460, collected: false }
                ],
                food: [
                    { x: 190, y: 490, collected: false },
                    { x: 260, y: 420, collected: false },
                    { x: 340, y: 340, collected: false },
                    { x: 420, y: 270, collected: false },
                    { x: 500, y: 340, collected: false },
                    { x: 580, y: 420, collected: false }
                ],
                cats: [
                    { x: 270, y: 400, name: 'Rocky', friendly: Math.random() > 0.4 },
                    { x: 400, y: 260, name: 'Summit', friendly: true },
                    { x: 540, y: 320, name: 'Cliff', friendly: Math.random() > 0.5 },
                    { x: 650, y: 400, name: 'Peak', friendly: Math.random() > 0.6 }
                ],
                bench: null,
                homeX: 700
            },
            {
                name: 'Royal Gardens',
                scene: 'castle',
                coins: [
                    { x: 180, y: 500, collected: false },
                    { x: 240, y: 440, collected: false },
                    { x: 300, y: 380, collected: false },
                    { x: 380, y: 320, collected: false },
                    { x: 460, y: 380, collected: false },
                    { x: 540, y: 440, collected: false },
                    { x: 620, y: 380, collected: false },
                    { x: 680, y: 500, collected: false }
                ],
                food: [
                    { x: 210, y: 470, collected: false },
                    { x: 270, y: 410, collected: false },
                    { x: 340, y: 350, collected: false },
                    { x: 420, y: 350, collected: false },
                    { x: 500, y: 410, collected: false },
                    { x: 580, y: 470, collected: false },
                    { x: 650, y: 440, collected: false }
                ],
                cats: [
                    { x: 250, y: 380, name: 'Duke', friendly: true },
                    { x: 400, y: 280, name: 'Duchess', friendly: Math.random() > 0.3 },
                    { x: 550, y: 360, name: 'Baron', friendly: Math.random() > 0.5 }
                ],
                bench: { x: 450, y: 480, used: false },
                homeX: 700
            }
        ];

        let currentLevel = levels[0];

        // Initialize game
        function init() {
            showModal(
                '🐱 Welcome to Cat Coin Adventure!',
                'You are a young cat starting at the river. Your mission is to collect coins and food for your family at home! But watch out - other cats might block your way. Let\'s start with some training!',
                [{ text: 'Start Training!', action: startTraining }]
            );
        }

        function startTraining() {
            hideModal();
            game.state = 'playing';
            game.level = 0;
            resetLevel();
            updateUI();
        }

        function resetLevel() {
            currentLevel = JSON.parse(JSON.stringify(levels[game.level]));
            player.x = 100;
            player.y = 500;
            player.dx = 0;
            player.dy = 0;
        }

        function resetToRiver() {
            player.x = 100;
            player.y = 500;
            player.dx = 0;
            player.dy = 0;
        }

        // Input handlers
        document.addEventListener('keydown', (e) => {
            if (e.key in keys) {
                keys[e.key] = true;
                e.preventDefault();
            }

            if (e.key === ' ' && game.state === 'playing') {
                checkCatInteraction();
                checkBenchInteraction();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key in keys) {
                keys[e.key] = false;
                e.preventDefault();
            }
        });

        // Touch controls
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let touchCurrentY = 0;
        let isTouching = false;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchStartX = touch.clientX - rect.left;
            touchStartY = touch.clientY - rect.top;
            touchCurrentX = touchStartX;
            touchCurrentY = touchStartY;
            isTouching = true;
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isTouching) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            touchCurrentX = touch.clientX - rect.left;
            touchCurrentY = touch.clientY - rect.top;
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isTouching = false;
            touchStartX = 0;
            touchStartY = 0;
            touchCurrentX = 0;
            touchCurrentY = 0;
        }, { passive: false });

        // Mobile talk button
        document.getElementById('talkButton').addEventListener('click', (e) => {
            e.preventDefault();
            if (game.state === 'playing') {
                checkCatInteraction();
                checkBenchInteraction();
            }
        });

        // Movement
        function updatePlayer() {
            if (game.state !== 'playing') return;

            player.dx = 0;
            player.dy = 0;

            // Keyboard controls
            if (keys.ArrowLeft || keys.a) player.dx = -player.speed;
            if (keys.ArrowRight || keys.d) player.dx = player.speed;
            if (keys.ArrowUp || keys.w) player.dy = -player.speed;
            if (keys.ArrowDown || keys.s) player.dy = player.speed;

            // Touch controls
            if (isTouching) {
                const deltaX = touchCurrentX - touchStartX;
                const deltaY = touchCurrentY - touchStartY;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                if (distance > 10) { // Dead zone
                    const scaleX = canvas.width / canvas.offsetWidth;
                    const scaleY = canvas.height / canvas.offsetHeight;

                    player.dx = (deltaX * scaleX) / 10;
                    player.dy = (deltaY * scaleY) / 10;

                    // Clamp speed
                    const speed = Math.sqrt(player.dx * player.dx + player.dy * player.dy);
                    if (speed > player.speed) {
                        player.dx = (player.dx / speed) * player.speed;
                        player.dy = (player.dy / speed) * player.speed;
                    }
                }
            }

            player.x += player.dx;
            player.y += player.dy;

            // Boundaries
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));

            // Collect coins
            currentLevel.coins.forEach(coin => {
                if (!coin.collected && checkCollision(player, { ...coin, width: 25, height: 25 })) {
                    coin.collected = true;
                    game.coins++;
                    updateUI();
                }
            });

            // Collect food
            currentLevel.food.forEach(food => {
                if (!food.collected && checkCollision(player, { ...food, width: 25, height: 25 })) {
                    food.collected = true;
                    game.food++;
                    updateUI();
                }
            });

            // Check if reached home
            if (player.x + player.width >= currentLevel.homeX) {
                reachHome();
            }
        }

        function checkCollision(obj1, obj2) {
            return obj1.x < obj2.x + obj2.width &&
                   obj1.x + obj1.width > obj2.x &&
                   obj1.y < obj2.y + obj2.height &&
                   obj1.y + obj1.height > obj2.y;
        }

        function checkCatInteraction() {
            currentLevel.cats.forEach((cat, index) => {
                const distance = Math.sqrt(
                    Math.pow(player.x - cat.x, 2) +
                    Math.pow(player.y - cat.y, 2)
                );

                if (distance < 80 && !cat.talked) {
                    cat.talked = true;
                    interactWithCat(cat);
                }
            });
        }

        function interactWithCat(cat) {
            game.state = 'dialogue';

            if (cat.friendly) {
                showModal(
                    `🐱 ${cat.name} says:`,
                    `"Hello there, young one! You look determined. Of course you can pass! Here, take these 50 coins for your journey!"`,
                    [{
                        text: 'Thank you!',
                        action: () => {
                            game.coins += 50;
                            updateUI();
                            hideModal();
                            game.state = 'playing';
                        }
                    }]
                );
            } else {
                showModal(
                    `😾 ${cat.name} says:`,
                    `"I'm not feeling generous today. You cannot pass! Go back to the river and try a different path!"`,
                    [{
                        text: 'Oh no...',
                        action: () => {
                            hideModal();
                            game.state = 'playing';
                            resetToRiver();
                        }
                    }]
                );
            }
        }

        function checkBenchInteraction() {
            if (!currentLevel.bench || currentLevel.bench.used) return;

            const distance = Math.sqrt(
                Math.pow(player.x - currentLevel.bench.x, 2) +
                Math.pow(player.y - currentLevel.bench.y, 2)
            );

            if (distance < 80) {
                currentLevel.bench.used = true;
                game.state = 'dialogue';
                showModal(
                    '🪑 Rest at the Bench',
                    'You sit down on the comfortable bench to rest. The peaceful moment refreshes you, and you find 10 coins that someone left behind!',
                    [{
                        text: 'Continue Journey',
                        action: () => {
                            game.coins += 10;
                            updateUI();
                            hideModal();
                            game.state = 'playing';
                        }
                    }]
                );
            }
        }

        function reachHome() {
            game.state = 'party';
            game.partyTime = 0;

            const totalItems = game.coins + game.food;
            const isLastLevel = game.level >= levels.length - 1;

            setTimeout(() => {
                if (isLastLevel) {
                    showModal(
                        '🎉 Congratulations! 🎉',
                        `You made it home with ${game.coins} coins and ${game.food} food items! Your family is so proud! You've completed all levels!`,
                        [{
                            text: 'Play Again',
                            action: () => {
                                game.level = 0;
                                game.coins = 0;
                                game.food = 0;
                                hideModal();
                                resetLevel();
                                game.state = 'playing';
                                updateUI();
                            }
                        }]
                    );
                } else {
                    showModal(
                        '🎉 Level Complete! 🎉',
                        `You made it home with ${game.coins} coins and ${game.food} food items! Your family is celebrating! Ready for the next level?`,
                        [{
                            text: 'Next Level',
                            action: () => {
                                game.level++;
                                hideModal();
                                resetLevel();
                                game.state = 'playing';
                                updateUI();
                            }
                        }]
                    );
                }
            }, 2000);
        }

        // Drawing functions
        function drawBackground() {
            // Draw scene based on level type
            switch(currentLevel.scene) {
                case 'river':
                    drawRiverScene();
                    break;
                case 'forest':
                    drawForestScene();
                    break;
                case 'village':
                    drawVillageScene();
                    break;
                case 'castle':
                    drawCastleScene();
                    break;
                case 'mountain':
                    drawMountainScene();
                    break;
                default:
                    drawRiverScene();
            }

            // Always draw the home area
            drawHome();
        }

        function drawRiverScene() {
            // River (left side)
            const waterColors = ['#1E40AF', '#2563EB', '#3B82F6'];
            for (let y = 0; y < canvas.height; y += 16) {
                for (let x = 0; x < 150; x += 16) {
                    ctx.fillStyle = waterColors[Math.floor((x + y) / 16) % 3];
                    ctx.fillRect(x, y, 16, 16);
                }
            }

            const waveOffset = Math.floor(Date.now() / 200) % 16;
            ctx.fillStyle = '#60A5FA';
            for (let y = 0; y < canvas.height; y += 32) {
                ctx.fillRect(0, y + waveOffset, 150, 4);
                ctx.fillRect(0, y + waveOffset + 16, 150, 4);
            }

            // Path
            const dirtColors = ['#8B7355', '#A0826D', '#6B5842'];
            for (let y = 0; y < canvas.height; y += 16) {
                for (let x = 150; x < currentLevel.homeX; x += 16) {
                    const tileIndex = ((x / 16) + (y / 16)) % 3;
                    ctx.fillStyle = dirtColors[Math.floor(tileIndex)];
                    ctx.fillRect(x, y, 16, 16);
                }
            }
        }

        function drawForestScene() {
            // Dark forest ground
            const grassColors = ['#2F4F2F', '#3B5F3B', '#274227'];
            for (let y = 0; y < canvas.height; y += 16) {
                for (let x = 0; x < currentLevel.homeX; x += 16) {
                    const tileIndex = ((x / 16) + (y / 16)) % 3;
                    ctx.fillStyle = grassColors[Math.floor(tileIndex)];
                    ctx.fillRect(x, y, 16, 16);
                }
            }

            // Trees
            for (let i = 0; i < 10; i++) {
                const tx = (i * 70 + 30) % (currentLevel.homeX - 50);
                const ty = (i * 83) % (canvas.height - 80);

                // Tree trunk
                ctx.fillStyle = '#654321';
                ctx.fillRect(tx, ty + 40, 16, 40);

                // Tree foliage
                ctx.fillStyle = '#228B22';
                ctx.fillRect(tx - 12, ty, 40, 50);
                ctx.fillStyle = '#32CD32';
                ctx.fillRect(tx - 8, ty + 10, 32, 30);
            }
        }

        function drawVillageScene() {
            // Cobblestone ground
            const stoneColors = ['#808080', '#696969', '#778899'];
            for (let y = 0; y < canvas.height; y += 16) {
                for (let x = 0; x < currentLevel.homeX; x += 16) {
                    const tileIndex = ((x / 16) + (y / 16)) % 3;
                    ctx.fillStyle = stoneColors[Math.floor(tileIndex)];
                    ctx.fillRect(x, y, 16, 16);

                    // Stone outlines
                    ctx.fillStyle = '#505050';
                    ctx.fillRect(x, y, 16, 1);
                    ctx.fillRect(x, y, 1, 16);
                }
            }

            // Village buildings (background)
            for (let i = 0; i < 3; i++) {
                const bx = 50 + i * 200;
                const by = 100;

                // Building
                ctx.fillStyle = '#D2691E';
                ctx.fillRect(bx, by, 60, 80);

                // Roof
                ctx.fillStyle = '#8B0000';
                ctx.fillRect(bx - 8, by, 76, 8);
                ctx.fillRect(bx - 4, by - 8, 68, 8);

                // Window
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(bx + 20, by + 20, 20, 20);
            }
        }

        function drawCastleScene() {
            // Stone castle floor
            const stoneColors = ['#A9A9A9', '#C0C0C0', '#DCDCDC'];
            for (let y = 0; y < canvas.height; y += 16) {
                for (let x = 0; x < currentLevel.homeX; x += 16) {
                    const tileIndex = ((x / 16) + (y / 16)) % 3;
                    ctx.fillStyle = stoneColors[Math.floor(tileIndex)];
                    ctx.fillRect(x, y, 16, 16);
                }
            }

            // Castle wall (background)
            ctx.fillStyle = '#696969';
            ctx.fillRect(0, 0, currentLevel.homeX, 120);

            // Battlements
            for (let i = 0; i < 20; i++) {
                if (i % 2 === 0) {
                    ctx.fillStyle = '#505050';
                    ctx.fillRect(i * 35, 0, 25, 30);
                }
            }

            // Castle towers
            ctx.fillStyle = '#696969';
            ctx.fillRect(50, 40, 40, 100);
            ctx.fillRect(300, 40, 40, 100);

            // Tower tops
            ctx.fillStyle = '#8B0000';
            ctx.fillRect(45, 30, 50, 15);
            ctx.fillRect(295, 30, 50, 15);
        }

        function drawMountainScene() {
            // Sky gradient
            for (let y = 0; y < canvas.height; y += 16) {
                const shade = Math.floor((y / canvas.height) * 100);
                ctx.fillStyle = `hsl(200, 60%, ${70 - shade/5}%)`;
                ctx.fillRect(0, y, currentLevel.homeX, 16);
            }

            // Mountains (background)
            ctx.fillStyle = '#8B7355';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(100, 300);
            ctx.lineTo(200, canvas.height);
            ctx.fill();

            ctx.fillStyle = '#A0826D';
            ctx.beginPath();
            ctx.moveTo(150, canvas.height);
            ctx.lineTo(280, 200);
            ctx.lineTo(400, canvas.height);
            ctx.fill();

            // Rocky path
            const rockColors = ['#8B7355', '#A0826D', '#6B5842'];
            for (let y = canvas.height - 150; y < canvas.height; y += 16) {
                for (let x = 100; x < currentLevel.homeX - 100; x += 16) {
                    const tileIndex = ((x / 16) + (y / 16)) % 3;
                    ctx.fillStyle = rockColors[Math.floor(tileIndex)];
                    ctx.fillRect(x, y, 16, 16);
                }
            }
        }

        function drawHome() {
            // Home area
            for (let y = 0; y < canvas.height; y += 16) {
                for (let x = currentLevel.homeX; x < canvas.width; x += 16) {
                    const shade = ((x + y) / 16) % 2 === 0 ? '#FFD700' : '#FFC800';
                    ctx.fillStyle = shade;
                    ctx.fillRect(x, y, 16, 16);
                }
            }

            // House
            const houseX = currentLevel.homeX + 20;
            const houseY = canvas.height - 200;

            ctx.fillStyle = '#8B4513';
            ctx.fillRect(houseX, houseY, 60, 80);
            ctx.fillStyle = '#654321';
            for (let i = 0; i < 60; i += 8) {
                for (let j = 0; j < 80; j += 8) {
                    if ((i + j) % 16 === 0) {
                        ctx.fillRect(houseX + i, houseY + j, 4, 4);
                    }
                }
            }

            // Roof
            ctx.fillStyle = '#DC2626';
            ctx.fillRect(houseX - 8, houseY, 76, 8);
            ctx.fillRect(houseX - 4, houseY - 8, 68, 8);
            ctx.fillRect(houseX, houseY - 16, 60, 8);
            ctx.fillRect(houseX + 4, houseY - 24, 52, 8);
            ctx.fillRect(houseX + 12, houseY - 32, 36, 8);
            ctx.fillRect(houseX + 20, houseY - 40, 20, 8);

            ctx.fillStyle = '#EF4444';
            ctx.fillRect(houseX + 8, houseY - 32, 4, 32);

            // Door
            ctx.fillStyle = '#422006';
            ctx.fillRect(houseX + 20, houseY + 30, 20, 50);
            ctx.fillStyle = '#654321';
            ctx.fillRect(houseX + 22, houseY + 32, 16, 46);
            ctx.fillStyle = '#422006';
            ctx.fillRect(houseX + 24, houseY + 36, 12, 18);
            ctx.fillRect(houseX + 24, houseY + 58, 12, 18);
            ctx.fillStyle = '#FCD34D';
            ctx.fillRect(houseX + 32, houseY + 56, 3, 3);

            // Windows
            ctx.fillStyle = '#0369A1';
            ctx.fillRect(houseX + 8, houseY + 12, 16, 16);
            ctx.fillRect(houseX + 36, houseY + 12, 16, 16);
            ctx.fillStyle = '#075985';
            ctx.fillRect(houseX + 8, houseY + 12, 16, 2);
            ctx.fillRect(houseX + 8, houseY + 20, 16, 2);
            ctx.fillRect(houseX + 14, houseY + 12, 2, 16);
            ctx.fillRect(houseX + 36, houseY + 12, 16, 2);
            ctx.fillRect(houseX + 36, houseY + 20, 16, 2);
            ctx.fillRect(houseX + 42, houseY + 12, 2, 16);
            ctx.fillStyle = '#7DD3FC';
            ctx.fillRect(houseX + 10, houseY + 14, 3, 3);
            ctx.fillRect(houseX + 38, houseY + 14, 3, 3);
        }

        function drawBench() {
            if (!currentLevel.bench) return;

            const bx = Math.floor(currentLevel.bench.x);
            const by = Math.floor(currentLevel.bench.y);

            // Bench seat
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(bx - 20, by, 40, 8);

            // Bench back
            ctx.fillRect(bx - 20, by - 16, 4, 20);
            ctx.fillRect(bx + 16, by - 16, 4, 20);
            ctx.fillRect(bx - 20, by - 16, 40, 4);

            // Bench legs
            ctx.fillRect(bx - 16, by + 8, 4, 12);
            ctx.fillRect(bx + 12, by + 8, 4, 12);

            // Shading
            ctx.fillStyle = '#654321';
            ctx.fillRect(bx - 18, by + 2, 36, 2);

            // Interaction hint
            if (!currentLevel.bench.used) {
                const distance = Math.sqrt(
                    Math.pow(player.x - currentLevel.bench.x, 2) +
                    Math.pow(player.y - currentLevel.bench.y, 2)
                );

                if (distance < 80 && game.state === 'playing') {
                    ctx.fillStyle = '#FEFCE8';
                    ctx.fillRect(bx - 30, by - 40, 60, 20);

                    ctx.fillStyle = '#CA8A04';
                    ctx.fillRect(bx - 30, by - 40, 60, 2);
                    ctx.fillRect(bx - 30, by - 22, 60, 2);
                    ctx.fillRect(bx - 30, by - 38, 2, 16);
                    ctx.fillRect(bx + 28, by - 38, 2, 16);

                    ctx.fillStyle = 'black';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('SPACE/TAP', bx, by - 27);
                }
            }
        }

        function drawPlayer() {
            const px = Math.floor(player.x);
            const py = Math.floor(player.y);

            // 16-bit pixel art cat
            // Tail (pixelated)
            ctx.fillStyle = '#D97706';
            ctx.fillRect(px - 12, py + 24, 8, 4);
            ctx.fillRect(px - 16, py + 20, 8, 4);
            ctx.fillRect(px - 18, py + 16, 6, 4);
            ctx.fillRect(px - 18, py + 12, 4, 4);

            // Tail stripes
            ctx.fillStyle = '#92400E';
            ctx.fillRect(px - 14, py + 22, 4, 2);
            ctx.fillRect(px - 17, py + 18, 4, 2);

            // Body
            ctx.fillStyle = player.color;
            ctx.fillRect(px + 4, py + 16, 28, 20);

            // Body shading
            ctx.fillStyle = '#D97706';
            ctx.fillRect(px + 6, py + 18, 24, 2);
            ctx.fillRect(px + 6, py + 32, 24, 2);

            // Legs
            ctx.fillStyle = player.color;
            ctx.fillRect(px + 8, py + 32, 6, 8);
            ctx.fillRect(px + 22, py + 32, 6, 8);

            // Paws
            ctx.fillStyle = '#FFF7ED';
            ctx.fillRect(px + 8, py + 36, 6, 4);
            ctx.fillRect(px + 22, py + 36, 6, 4);

            // Head
            ctx.fillStyle = player.color;
            ctx.fillRect(px + 12, py + 4, 20, 20);

            // Ears (pixel art)
            ctx.fillStyle = '#EA580C';
            ctx.fillRect(px + 8, py, 8, 12);
            ctx.fillRect(px + 28, py, 8, 12);

            // Ear inner
            ctx.fillStyle = '#FDBA74';
            ctx.fillRect(px + 10, py + 4, 4, 4);
            ctx.fillRect(px + 30, py + 4, 4, 4);

            // Face outline
            ctx.fillStyle = '#92400E';
            ctx.fillRect(px + 12, py + 4, 20, 2);
            ctx.fillRect(px + 12, py + 22, 20, 2);
            ctx.fillRect(px + 12, py + 6, 2, 16);
            ctx.fillRect(px + 30, py + 6, 2, 16);

            // Eyes
            ctx.fillStyle = 'white';
            ctx.fillRect(px + 16, py + 10, 6, 6);
            ctx.fillRect(px + 26, py + 10, 6, 6);

            // Eye outline
            ctx.fillStyle = 'black';
            ctx.fillRect(px + 16, py + 10, 6, 1);
            ctx.fillRect(px + 16, py + 15, 6, 1);
            ctx.fillRect(px + 26, py + 10, 6, 1);
            ctx.fillRect(px + 26, py + 15, 6, 1);

            // Pupils
            ctx.fillStyle = '#16A34A';
            ctx.fillRect(px + 18, py + 12, 3, 3);
            ctx.fillRect(px + 28, py + 12, 3, 3);

            // Pupils highlight
            ctx.fillStyle = 'white';
            ctx.fillRect(px + 19, py + 12, 1, 1);
            ctx.fillRect(px + 29, py + 12, 1, 1);

            // Nose
            ctx.fillStyle = '#EC4899';
            ctx.fillRect(px + 22, py + 17, 2, 2);

            // Whiskers
            ctx.fillStyle = 'black';
            ctx.fillRect(px + 8, py + 16, 4, 1);
            ctx.fillRect(px + 8, py + 18, 4, 1);
            ctx.fillRect(px + 32, py + 16, 4, 1);
            ctx.fillRect(px + 32, py + 18, 4, 1);

            // Chest/belly
            ctx.fillStyle = '#FFF7ED';
            ctx.fillRect(px + 16, py + 24, 12, 8);
        }

        function drawCoins() {
            const coinFrame = Math.floor(Date.now() / 150) % 4;

            currentLevel.coins.forEach(coin => {
                if (!coin.collected) {
                    const cx = Math.floor(coin.x);
                    const cy = Math.floor(coin.y);

                    // 16-bit animated coin
                    if (coinFrame === 0 || coinFrame === 2) {
                        // Full width coin
                        ctx.fillStyle = '#B45309';
                        ctx.fillRect(cx - 8, cy - 8, 16, 16);

                        ctx.fillStyle = '#FCD34D';
                        ctx.fillRect(cx - 6, cy - 6, 12, 12);

                        ctx.fillStyle = '#EAB308';
                        ctx.fillRect(cx - 4, cy - 4, 8, 8);

                        // Coin detail
                        ctx.fillStyle = '#F59E0B';
                        ctx.fillRect(cx - 2, cy - 2, 4, 4);

                        // Outer ring
                        ctx.fillStyle = '#92400E';
                        ctx.fillRect(cx - 8, cy - 8, 16, 2);
                        ctx.fillRect(cx - 8, cy + 6, 16, 2);
                        ctx.fillRect(cx - 8, cy - 6, 2, 12);
                        ctx.fillRect(cx + 6, cy - 6, 2, 12);
                    } else if (coinFrame === 1) {
                        // Medium width
                        ctx.fillStyle = '#B45309';
                        ctx.fillRect(cx - 6, cy - 8, 12, 16);

                        ctx.fillStyle = '#FCD34D';
                        ctx.fillRect(cx - 4, cy - 6, 8, 12);

                        ctx.fillStyle = '#EAB308';
                        ctx.fillRect(cx - 3, cy - 4, 6, 8);

                        ctx.fillStyle = '#92400E';
                        ctx.fillRect(cx - 6, cy - 8, 12, 2);
                        ctx.fillRect(cx - 6, cy + 6, 12, 2);
                    } else {
                        // Thin coin
                        ctx.fillStyle = '#B45309';
                        ctx.fillRect(cx - 3, cy - 8, 6, 16);

                        ctx.fillStyle = '#FCD34D';
                        ctx.fillRect(cx - 2, cy - 6, 4, 12);

                        ctx.fillStyle = '#92400E';
                        ctx.fillRect(cx - 3, cy - 8, 6, 2);
                        ctx.fillRect(cx - 3, cy + 6, 6, 2);
                    }

                    // Sparkle effect
                    if (coinFrame === 0) {
                        ctx.fillStyle = '#FEF9C3';
                        ctx.fillRect(cx - 10, cy - 10, 2, 2);
                        ctx.fillRect(cx + 8, cy + 8, 2, 2);
                        ctx.fillRect(cx + 8, cy - 10, 2, 2);
                    }
                }
            });
        }

        function drawFood() {
            currentLevel.food.forEach(food => {
                if (!food.collected) {
                    const fx = Math.floor(food.x);
                    const fy = Math.floor(food.y);

                    // 16-bit pixel art fish
                    // Tail
                    ctx.fillStyle = '#0EA5E9';
                    ctx.fillRect(fx - 12, fy - 4, 4, 8);
                    ctx.fillRect(fx - 14, fy - 6, 4, 4);
                    ctx.fillRect(fx - 14, fy + 2, 4, 4);

                    // Body
                    ctx.fillStyle = '#38BDF8';
                    ctx.fillRect(fx - 8, fy - 6, 14, 12);

                    // Body highlight
                    ctx.fillStyle = '#7DD3FC';
                    ctx.fillRect(fx - 6, fy - 4, 10, 2);

                    // Belly
                    ctx.fillStyle = '#E0F2FE';
                    ctx.fillRect(fx - 6, fy, 10, 4);

                    // Head
                    ctx.fillStyle = '#0284C7';
                    ctx.fillRect(fx + 4, fy - 4, 4, 8);

                    // Eye
                    ctx.fillStyle = 'white';
                    ctx.fillRect(fx + 4, fy - 2, 2, 2);
                    ctx.fillStyle = 'black';
                    ctx.fillRect(fx + 5, fy - 2, 1, 1);

                    // Fins
                    ctx.fillStyle = '#0EA5E9';
                    ctx.fillRect(fx - 2, fy - 8, 4, 4);
                    ctx.fillRect(fx - 2, fy + 4, 4, 4);

                    // Outline
                    ctx.fillStyle = '#075985';
                    // Top
                    ctx.fillRect(fx - 8, fy - 6, 12, 1);
                    // Bottom
                    ctx.fillRect(fx - 8, fy + 5, 12, 1);
                    // Head point
                    ctx.fillRect(fx + 6, fy - 2, 2, 4);

                    // Fish bones (crossed)
                    ctx.fillStyle = '#BAE6FD';
                    ctx.fillRect(fx - 4, fy, 1, 4);
                    ctx.fillRect(fx - 2, fy, 1, 4);
                    ctx.fillRect(fx, fy, 1, 4);
                }
            });
        }

        function drawCats() {
            currentLevel.cats.forEach(cat => {
                const cx = Math.floor(cat.x);
                const cy = Math.floor(cat.y);
                const catColor = cat.friendly ? '#A78BFA' : '#6B7280';
                const darkColor = cat.friendly ? '#7C3AED' : '#374151';

                // 16-bit pixel art NPC cat (sitting position)
                // Tail (curled)
                ctx.fillStyle = darkColor;
                ctx.fillRect(cx - 8, cy + 28, 6, 4);
                ctx.fillRect(cx - 6, cy + 24, 4, 4);
                ctx.fillRect(cx - 4, cy + 20, 4, 4);

                // Body (sitting)
                ctx.fillStyle = catColor;
                ctx.fillRect(cx + 4, cy + 20, 24, 20);

                // Body shading
                ctx.fillStyle = darkColor;
                ctx.fillRect(cx + 6, cy + 22, 20, 2);

                // Front paws
                ctx.fillStyle = catColor;
                ctx.fillRect(cx + 8, cy + 36, 6, 4);
                ctx.fillRect(cx + 18, cy + 36, 6, 4);

                // Paw pads
                ctx.fillStyle = '#FEE2E2';
                ctx.fillRect(cx + 10, cy + 36, 2, 2);
                ctx.fillRect(cx + 20, cy + 36, 2, 2);

                // Head
                ctx.fillStyle = catColor;
                ctx.fillRect(cx + 8, cy + 4, 20, 20);

                // Ears (pixel art)
                ctx.fillStyle = cat.friendly ? '#8B5CF6' : '#4B5563';
                ctx.fillRect(cx + 4, cy, 8, 12);
                ctx.fillRect(cx + 24, cy, 8, 12);

                // Ear inner
                ctx.fillStyle = '#DDD6FE';
                ctx.fillRect(cx + 6, cy + 4, 4, 4);
                ctx.fillRect(cx + 26, cy + 4, 4, 4);

                // Face details
                ctx.fillStyle = darkColor;
                ctx.fillRect(cx + 8, cy + 4, 20, 2);

                // Eyes
                ctx.fillStyle = 'white';
                ctx.fillRect(cx + 12, cy + 10, 6, 6);
                ctx.fillRect(cx + 22, cy + 10, 6, 6);

                // Eye outline
                ctx.fillStyle = 'black';
                ctx.fillRect(cx + 12, cy + 10, 6, 1);
                ctx.fillRect(cx + 12, cy + 15, 6, 1);
                ctx.fillRect(cx + 22, cy + 10, 6, 1);
                ctx.fillRect(cx + 22, cy + 15, 6, 1);

                // Pupils (different for friendly/unfriendly)
                if (cat.friendly) {
                    ctx.fillStyle = '#6366F1';
                    ctx.fillRect(cx + 14, cy + 12, 3, 3);
                    ctx.fillRect(cx + 24, cy + 12, 3, 3);
                } else {
                    ctx.fillStyle = '#DC2626';
                    ctx.fillRect(cx + 14, cy + 12, 3, 2);
                    ctx.fillRect(cx + 24, cy + 12, 3, 2);
                }

                // Pupil highlight
                ctx.fillStyle = 'white';
                ctx.fillRect(cx + 15, cy + 12, 1, 1);
                ctx.fillRect(cx + 25, cy + 12, 1, 1);

                // Nose
                ctx.fillStyle = '#F472B6';
                ctx.fillRect(cx + 18, cy + 17, 2, 2);

                // Whiskers
                ctx.fillStyle = 'black';
                ctx.fillRect(cx + 4, cy + 16, 4, 1);
                ctx.fillRect(cx + 4, cy + 18, 4, 1);
                ctx.fillRect(cx + 28, cy + 16, 4, 1);
                ctx.fillRect(cx + 28, cy + 18, 4, 1);

                // Name tag (pixel art style)
                ctx.fillStyle = cat.friendly ? '#DDD6FE' : '#E5E7EB';
                ctx.fillRect(cx - 8, cy - 18, 52, 14);

                // Tag border
                ctx.fillStyle = darkColor;
                ctx.fillRect(cx - 8, cy - 18, 52, 2);
                ctx.fillRect(cx - 8, cy - 6, 52, 2);
                ctx.fillRect(cx - 8, cy - 16, 2, 12);
                ctx.fillRect(cx + 42, cy - 16, 2, 12);

                // Name
                ctx.fillStyle = 'black';
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(cat.name, cx + 18, cy - 7);

                // Interaction hint
                const distance = Math.sqrt(
                    Math.pow(player.x - cat.x, 2) +
                    Math.pow(player.y - cat.y, 2)
                );

                if (distance < 80 && !cat.talked && game.state === 'playing') {
                    // Pixel art speech bubble hint
                    ctx.fillStyle = '#FEFCE8';
                    ctx.fillRect(cx - 20, cy + 48, 76, 20);

                    ctx.fillStyle = '#CA8A04';
                    ctx.fillRect(cx - 20, cy + 48, 76, 2);
                    ctx.fillRect(cx - 20, cy + 66, 76, 2);
                    ctx.fillRect(cx - 20, cy + 50, 2, 16);
                    ctx.fillRect(cx + 54, cy + 50, 2, 16);

                    ctx.fillStyle = 'black';
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('SPACE/TAP', cx + 18, cy + 61);
                }
            });
        }

        function drawParty() {
            if (game.state !== 'party') return;

            game.partyTime++;

            // Confetti
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * canvas.width;
                const y = (game.partyTime * 3 + i * 30) % canvas.height;
                const color = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF'][i % 5];

                ctx.fillStyle = color;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(game.partyTime * 0.1 + i);
                ctx.fillRect(-5, -5, 10, 10);
                ctx.restore();
            }

            // Balloons
            for (let i = 0; i < 5; i++) {
                const x = currentLevel.homeX + 30 + i * 15;
                const y = 100 - Math.sin(game.partyTime * 0.1 + i) * 10;
                const color = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#F38181'][i];

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 15, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y + 15);
                ctx.lineTo(x, y + 40);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawBackground();
            drawBench();
            drawCoins();
            drawFood();
            drawCats();
            drawPlayer();
            drawParty();
        }

        function updateUI() {
            document.getElementById('coinCount').textContent = game.coins;
            document.getElementById('foodCount').textContent = game.food;
            document.getElementById('levelCount').textContent = currentLevel.name;
        }

        // Modal functions
        function showModal(title, text, buttons) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const modalButtons = document.getElementById('modalButtons');

            modalTitle.textContent = title;
            modalText.textContent = text;
            modalButtons.innerHTML = '';

            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'button';
                button.textContent = btn.text;
                button.onclick = btn.action;
                modalButtons.appendChild(button);
            });

            modal.style.display = 'flex';
        }

        function hideModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Game loop
        function gameLoop() {
            updatePlayer();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start game
        init();
        gameLoop();
    </script>
</body>
</html>
